# Agent-based Vulnerability Harvest Configuration
# Used by the Controller Agent for orchestrating the vulnerability intelligence pipeline

agents:
  controller:
    timeout: 3600  # 1 hour timeout
    max_retries: 3
    enable_metrics: true
    
  cve_fetch:
    timeout: 1800  # 30 minutes for data fetching
    max_retries: 5
    parallel_requests: 10
    
    # Data sources configuration
    sources:
      cve_list:
        enabled: true
        repo: "CVEProject/cvelistV5"
        max_age_days: 1  # Only fetch CVEs modified in last day on incremental runs
        
      epss:
        enabled: true
        api_url: "https://api.first.org/data/v1/epss"
        batch_size: 1000
        rate_limit: 10  # requests per second
        
      github_advisory:
        enabled: true
        graphql_endpoint: "https://api.github.com/graphql"
        max_results: 1000
    
    # Filtering criteria
    filters:
      severities: ["CRITICAL", "HIGH"]
      min_epss_score: 0.7  # 70% exploitation probability
      min_cvss_score: 7.0
      years: [2024, 2025]
      exclude_rejected: true
      require_description: true
    
  static_page:
    timeout: 600  # 10 minutes for page generation
    max_retries: 2
    
    # Page generation settings
    template_dir: "src/_layouts"
    output_dir: "src/cves"
    batch_size: 50  # Process CVEs in batches
    
    # Content settings
    include_timeline: true
    include_references: true
    include_affected_systems: true
    max_description_length: 2000
    
  dashboard:
    timeout: 300  # 5 minutes for dashboard generation
    max_retries: 2
    
    # Dashboard configuration
    output_file: "src/index.njk"
    embed_data: true
    max_vulnerabilities: 10000  # Prevent memory issues
    
    # Statistics configuration
    include_charts: true
    chart_types: ["severity", "risk_trends", "vendor_analysis"]
    
  ci:
    timeout: 300  # 5 minutes for CI tasks
    max_retries: 1
    
    # Code quality checks
    enable_linting: true
    enable_security_scan: true
    enable_tests: false  # Skip tests in harvest workflow
    
    # Git configuration
    commit_message_template: "feat: update vulnerability intelligence ({date}) 🛡️"
    co_author: "Claude <noreply@anthropic.com>"

# Global settings
global:
  cache_dir: "actions-cache"
  temp_dir: "/tmp/vuln-harvest"
  log_level: "INFO"
  enable_debug: false
  
  # Performance settings
  max_memory_mb: 2048
  max_concurrent_agents: 3
  
  # Error handling
  fail_fast: false
  continue_on_warnings: true
  
# Output configuration
output:
  formats: ["json", "markdown", "html"]
  chunk_strategy: "severity-year"  # Group by severity and year
  max_chunk_size: 5000  # Max vulnerabilities per chunk file
  
  # API generation
  generate_api: true
  api_dir: "public/api/vulns"
  
  # Search index
  generate_search_index: true
  search_fields: ["cveId", "title", "vendors", "products", "description"]
  
# Monitoring and metrics
monitoring:
  enable_performance_tracking: true
  track_agent_metrics: true
  export_metrics: true
  metrics_retention_days: 30
  
  # Health checks
  enable_health_checks: true
  check_intervals:
    memory: 30  # seconds
    disk_space: 60  # seconds
    network: 120  # seconds

# Deployment settings (GitHub Pages specific)
deployment:
  target: "github_pages"
  branch: "gh-pages"
  path_prefix: "/vuln-bot"
  
  # Build optimization
  enable_compression: true
  minify_assets: true
  optimize_images: false  # Not needed for this project
  
  # Cache control
  cache_headers:
    static: "public, max-age=31536000"  # 1 year for static assets
    data: "public, max-age=14400"       # 4 hours for data files
    pages: "public, max-age=7200"       # 2 hours for HTML pages