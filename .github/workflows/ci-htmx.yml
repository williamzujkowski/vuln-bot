name: CI (HTMX Version)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.x"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-cov
      
      - name: Run Python linting
        run: |
          ruff check scripts/
          ruff format --check scripts/
      
      - name: Run Python tests
        run: |
          pytest --cov=scripts --cov-report=xml --cov-report=term tests/
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Bandit security scan
        uses: tj-actions/bandit@v5.5
        with:
          targets: |
            scripts/
          options: "-r -ll -i"
      
      - name: Run TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  validate-htmx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate HTMX dashboard HTML
        run: |
          # Check if dashboard HTML exists and is valid
          if [ -f "src/dashboard-htmx.html" ]; then
            echo "✅ HTMX dashboard template found"
            # Basic HTML validation
            python -c "
import html.parser
with open('src/dashboard-htmx.html', 'r') as f:
    parser = html.parser.HTMLParser()
    parser.feed(f.read())
print('✅ HTML is valid')
"
          else
            echo "❌ HTMX dashboard template not found"
            exit 1
          fi
      
      - name: Check service worker
        run: |
          if [ -f "public/sw.js" ]; then
            echo "✅ Service worker found"
          else
            echo "⚠️  Service worker not found (will be created on first build)"
          fi
      
      - name: Validate Python generator
        run: |
          python -m py_compile scripts/generate_htmx_dashboard.py
          echo "✅ HTMX generator syntax is valid"

  test-dashboard-generation:
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
      
      - name: Create mock database
        run: |
          # Create a minimal test database
          mkdir -p .cache
          python -c "
import sqlite3
import json
from datetime import datetime, timedelta

db = sqlite3.connect('.cache/vulns.db')
cursor = db.cursor()

# Create table
cursor.execute('''
CREATE TABLE IF NOT EXISTS vulnerabilities (
    cve_id TEXT PRIMARY KEY,
    title TEXT,
    severity TEXT,
    cvss_score REAL,
    epss_percentile INTEGER,
    published_date TEXT,
    last_modified_date TEXT,
    vendors TEXT,
    products TEXT,
    tags TEXT,
    description TEXT,
    attack_vector TEXT,
    attack_complexity TEXT,
    privileges_required TEXT,
    user_interaction TEXT,
    scope TEXT,
    confidentiality_impact TEXT,
    integrity_impact TEXT,
    availability_impact TEXT
)
''')

# Insert test data
test_data = [
    {
        'cve_id': 'CVE-2024-TEST1',
        'title': 'Test Critical Vulnerability',
        'severity': 'CRITICAL',
        'cvss_score': 9.8,
        'epss_percentile': 95,
        'published_date': datetime.now().isoformat(),
        'last_modified_date': datetime.now().isoformat(),
        'vendors': json.dumps(['TestVendor']),
        'products': json.dumps(['TestProduct']),
        'tags': json.dumps(['KEV']),
        'description': 'Test vulnerability',
        'attack_vector': 'NETWORK',
        'attack_complexity': 'LOW',
        'privileges_required': 'NONE',
        'user_interaction': 'NONE',
        'scope': 'CHANGED',
        'confidentiality_impact': 'HIGH',
        'integrity_impact': 'HIGH',
        'availability_impact': 'HIGH'
    },
    {
        'cve_id': 'CVE-2024-TEST2',
        'title': 'Test High Vulnerability',
        'severity': 'HIGH',
        'cvss_score': 8.1,
        'epss_percentile': 85,
        'published_date': (datetime.now() - timedelta(days=1)).isoformat(),
        'last_modified_date': datetime.now().isoformat(),
        'vendors': json.dumps(['AnotherVendor']),
        'products': json.dumps(['AnotherProduct']),
        'tags': json.dumps([]),
        'description': 'Another test vulnerability',
        'attack_vector': 'NETWORK',
        'attack_complexity': 'LOW',
        'privileges_required': 'LOW',
        'user_interaction': 'NONE',
        'scope': 'UNCHANGED',
        'confidentiality_impact': 'HIGH',
        'integrity_impact': 'LOW',
        'availability_impact': 'NONE'
    }
]

for vuln in test_data:
    cursor.execute('''
        INSERT INTO vulnerabilities VALUES (
            :cve_id, :title, :severity, :cvss_score, :epss_percentile,
            :published_date, :last_modified_date, :vendors, :products, :tags,
            :description, :attack_vector, :attack_complexity, :privileges_required,
            :user_interaction, :scope, :confidentiality_impact, :integrity_impact,
            :availability_impact
        )
    ''', vuln)

db.commit()
db.close()
print('✅ Test database created')
"
      
      - name: Test HTMX dashboard generation
        run: |
          python scripts/generate_htmx_dashboard.py
          
          # Verify output
          if [ -f "public/index.html" ]; then
            echo "✅ Main dashboard generated"
          else
            echo "❌ Main dashboard not generated"
            exit 1
          fi
          
          if [ -d "public/fragments" ]; then
            echo "✅ Fragments directory created"
            echo "Generated fragments:"
            find public/fragments -name "*.html" | head -10
          else
            echo "❌ Fragments not generated"
            exit 1
          fi
          
          if [ -f "public/data/vulnerabilities.json" ]; then
            echo "✅ JSON data generated"
          else
            echo "❌ JSON data not generated"
            exit 1
          fi
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: public/
          retention-days: 1