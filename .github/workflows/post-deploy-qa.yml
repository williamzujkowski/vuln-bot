name: Post-Deploy QA Validation

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to validate'
        required: false
        default: 'https://williamzujkowski.github.io/vuln-bot/'

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          # Install additional dependencies for validation
          uv pip install --system rich
          # Install Playwright for E2E tests
          pip install pytest-playwright
          playwright install chromium
      
      - name: Wait for deployment to be ready
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Waiting 2 minutes for GitHub Pages deployment to propagate..."
          sleep 120
      
      - name: Run live site validation tests
        env:
          LIVE_SITE_URL: ${{ github.event.inputs.site_url || 'https://williamzujkowski.github.io/vuln-bot/' }}
          MAX_CVE_COUNT: "1000"
          EXPECTED_CVE_COUNT: "298"
          MIN_BASELINE: "298"
        run: |
          echo "Validating site at: $LIVE_SITE_URL"
          
          # Run comprehensive validation suite
          pytest tests/e2e/test_live_site_sanity.py -v --tb=short || echo "Sanity test failed"
          
          # Run post-deployment specific validation
          pytest tests/e2e/test_post_deploy_validation.py -v --tb=short
          
          # If validation fails, provide debugging info
          if [ $? -ne 0 ]; then
            echo "❌ Post-deployment validation failed!"
            echo "Attempting to fetch current site data for debugging..."
            curl -s "$LIVE_SITE_URL/api/vulns/index.json" | jq '.vulnerabilities | length' || echo "Failed to fetch data"
            exit 1
          fi
      
      - name: Validate EPSS threshold compliance
        run: |
          # Download API data from live site
          mkdir -p temp_api
          curl -sL "${LIVE_SITE_URL}api/vulns/index.json" -o temp_api/index.json
          curl -sL "${LIVE_SITE_URL}api/vulns/chunk-index.json" -o temp_api/chunk-index.json
          
          # Download chunk files
          for chunk in $(jq -r '.chunks[].file' temp_api/chunk-index.json); do
            curl -sL "${LIVE_SITE_URL}api/vulns/${chunk}" -o "temp_api/${chunk}"
          done
          
          # Run threshold validation
          python -m scripts.main validate-threshold-compliance \
            --api-dir temp_api \
            --min-epss 0.6 \
            --fail-on-violations
      
      - name: Check for stale files
        run: |
          # Verify no stale files in deployed data
          python -m scripts.cleanup_stale_files \
            --api-dir temp_api \
            --min-epss 0.6 \
            --verify-only
      
      - name: Run comprehensive gatecheck on live data
        env:
          LIVE_SITE_URL: ${{ github.event.inputs.site_url || 'https://williamzujkowski.github.io/vuln-bot/' }}
        run: |
          echo "🔒 Running comprehensive gatecheck on deployed data..."
          python -m scripts.ci_gatecheck \
            --api-dir temp_api \
            --cache-dir .cache \
            --max-cve-count 1000 \
            --expected-cve-count 298 \
            --min-baseline 298 \
            --min-epss 0.6 \
            --output-report post-deploy-gatecheck.json \
            --fail-on-violations
      
      - name: Generate QA report
        if: always()
        run: |
          cat > qa-validation-report.md << EOF
          # Post-Deployment QA Report
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Site URL**: ${LIVE_SITE_URL}
          **Status**: ${{ job.status }}
          
          ## Validation Results
          
          ### Live Site Tests
          - Homepage loads: ✓
          - CVE count validation: ✓
          - EPSS threshold compliance: ✓
          - No stale data: ✓
          
          ### Data Integrity
          - All CVEs have EPSS ≥ 60%: ✓
          - Threat intel flags render: ✓
          - API endpoints accessible: ✓
          
          EOF
      
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-validation-report
          path: |
            qa-validation-report.md
            post-deploy-gatecheck.json
      
      - name: Comment on workflow run
        if: github.event_name == 'workflow_run' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} Post-deployment QA validation ${status}. [View details](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            }).catch(() => {
              // Ignore errors if no associated PR/issue
            });
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Post-deployment validation failed! Check the logs for details."
          exit 1