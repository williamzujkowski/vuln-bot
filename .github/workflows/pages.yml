name: Deploy to GitHub Pages

on:
  # Manual trigger only - automated deployment happens in scheduled-harvest.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: The HTMX dashboard is generated by the Python scripts during scheduled harvests
      # We only need to check if the public directory exists and deploy it
      - name: Check for public directory
        run: |
          if [ ! -d "public" ]; then
            echo "⚠️ Public directory not found!"
            echo "The dashboard is generated during scheduled harvests."
            echo "Creating placeholder..."
            mkdir -p public
            echo "<h1>Dashboard will be available after first harvest</h1>" > public/index.html
          else
            echo "✅ Public directory found with $(find public -type f | wc -l) files"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4