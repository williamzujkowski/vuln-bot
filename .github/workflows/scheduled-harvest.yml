name: Vulnerability Harvest (Every 4 Hours)

on:
  schedule:
    # Run every 4 hours starting at midnight UTC
    # 0:00, 4:00, 8:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no commits)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.x"

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: actions-cache/
          key: api-cache-${{ hashFiles('scripts/harvest/**/*.py') }}
          restore-keys: |
            api-cache-
      
      - name: Cache generation metadata
        uses: actions/cache@v4
        with:
          path: public/.generation_metadata/
          key: generation-metadata-${{ github.run_number }}
          restore-keys: |
            generation-metadata-
      
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
      
      - name: Force purge stale files (Critical Fix)
        run: |
          echo "🔥 FORCE PURGE: Implementing comprehensive stale file cleanup..."
          
          # Step 1: Force purge all build directories
          echo "Step 1: Purging all build directories..."
          python -m scripts.cleanup_stale_files \
            --build-dir _site \
            --api-dir api \
            --posts-dir src/_posts \
            --min-epss 0.6 \
            --force-purge
          echo "✓ Build directories force purged"
          
          # Step 2: Complete removal of public directory
          echo "Step 2: Complete removal of public directory..."
          rm -rf public
          mkdir -p public
          echo "✓ Public directory completely recreated"
          
          # Step 3: Audit for remaining stale files
          echo "Step 3: Auditing for any remaining stale files..."
          if python -m scripts.cleanup_stale_files --build-dir _site --api-dir api --safe-mode | grep -q "Would delete"; then
            echo "::warning::Stale files still detected after cleanup"
          else
            echo "✓ No stale files detected"
          fi
      
      - name: Run vulnerability harvest
        id: harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EPSS_API_KEY: ${{ secrets.EPSS_API_KEY }}
        run: |
          echo "Starting vulnerability harvest..."
          python -m scripts.main harvest \
            --cache-dir actions-cache/ \
            --years 2024 \
            --years 2025 \
            --min-severity HIGH \
            --min-epss 0.6 2>&1 | tee harvest.log
          
          # Extract metrics from log
          VULNS_FOUND=$(grep -o "Total vulnerabilities: [0-9]\+" harvest.log | grep -o "[0-9]\+" | tail -1 || echo "0")
          echo "vulnerabilities_found=$VULNS_FOUND" >> $GITHUB_OUTPUT
          echo "Found $VULNS_FOUND vulnerabilities in harvest"
          
          # Check for errors
          if grep -q "Failed to fetch" harvest.log; then
            echo "::warning::Some API fetch failures detected"
          fi
          
          # Check if no vulnerabilities were selected (not just harvested)
          if grep -q "selected=0" harvest.log; then
            echo "::warning::No vulnerabilities were selected after filtering - check thresholds"
          fi
      
      - name: Generate vulnerability briefing
        run: |
          python -m scripts.main generate-briefing \
            --cache-dir actions-cache/ \
            --output-dir .
      
      - name: Data validation - Raw ingestion
        run: |
          echo "Validating raw data quality..."
          python -m scripts.validate_data_quality \
            --stage raw \
            --api-dir api \
            --output-dir reports
      
      - name: Enrich with CISA KEV data
        continue-on-error: true  # Optional enrichment, don't block pipeline
        run: |
          echo "Enriching vulnerabilities with CISA KEV data..."
          python -m scripts.enhance_cisa_kev \
            --api-dir api \
            --output-dir api

      - name: Enrich with exploit availability
        continue-on-error: true  # Optional enrichment, don't block pipeline
        run: |
          echo "Adding exploit availability flags and EPSS percentiles..."
          python -m scripts.enhance_exploit_availability \
            --api-dir api \
            --output-dir api
      
      - name: Data validation - After enrichment
        run: |
          echo "Validating enriched data quality..."
          python -m scripts.validate_data_quality \
            --stage enriched \
            --api-dir api \
            --output-dir reports
      
      - name: Validate EPSS threshold compliance
        id: compliance_check
        run: |
          echo "Validating EPSS threshold compliance (≥60%)..."
          python -m scripts.main validate-threshold-compliance \
            --api-dir api \
            --cache-dir actions-cache/ \
            --output-dir reports \
            --min-epss 0.6 \
            --fail-on-violations
          echo "compliance_passed=true" >> $GITHUB_OUTPUT
        continue-on-error: false
      
      - name: Data validation - Final publication
        run: |
          echo "Validating final published data..."
          python -m scripts.validate_data_quality \
            --stage published \
            --api-dir api \
            --output-dir reports
      
      - name: Copy API files to public directory
        run: |
          echo "Copying fresh API files from root to public directory..."
          mkdir -p public/api/vulns
          if [ -d "api/vulns" ]; then
            cp -r api/vulns/* public/api/vulns/
            echo "✓ Copied API files to public directory"
            echo "Files copied:"
            ls -la public/api/vulns/ | head -10
          else
            echo "⚠ Warning: No API files found in root directory"
            exit 1
          fi
      
      - name: Force clean build (Non-incremental)
        id: build_site
        run: |
          echo "🚀 FORCE NON-INCREMENTAL BUILD: Ensuring complete site rebuild..."
          
          # Step 1: Complete removal of output directories
          echo "Step 1: Complete removal of output directories..."
          rm -rf _site public
          mkdir -p _site public
          echo "✓ Output directories completely recreated"
          
          # Step 2: Install Node dependencies if needed
          if [ -f "package.json" ] && [ ! -d "node_modules" ]; then
            echo "Installing Node dependencies..."
            npm install
          fi
          
          # Step 3: Run 11ty with EXPLICIT non-incremental build
          echo "Step 3: Running 11ty with FULL BUILD mode (non-incremental)..."
          if command -v npx &> /dev/null && [ -f ".eleventy.js" ]; then
            # CRITICAL: Do NOT use --incremental flag
            # Force full rebuild by ensuring clean state
            echo "Executing: npx eleventy --output=public --quiet"
            npx eleventy --output=public --quiet
            BUILD_EXIT_CODE=$?
            
            if [ $BUILD_EXIT_CODE -eq 0 ]; then
              echo "✓ 11ty build completed successfully"
            else
              echo "⚠ 11ty build failed with exit code $BUILD_EXIT_CODE, using Python fallback"
            fi
          else
            echo "11ty not available, using Python generator"
            BUILD_EXIT_CODE=1
          fi
          
          # Step 4: Python fallback if 11ty failed
          if [ $BUILD_EXIT_CODE -ne 0 ] || [ ! -f "public/index.html" ]; then
            echo "Step 4: Using Python generator as fallback..."
            mkdir -p .cache
            
            # Copy the database to the expected location
            cp actions-cache/vulnerability_cache.db .cache/vulns.db || true
            
            # Use incremental generator (but with clean output)
            python -m scripts.incremental_generator \
              --db-path .cache/vulns.db \
              --output-dir public \
              --force-rebuild
          fi
          
          # Step 5: Verify build produced valid files
          echo "Step 5: Verifying build output..."
          if [ -d "public/api/vulns" ] && [ -f "public/index.html" ]; then
            CVE_FILES=$(find public/cves -name "CVE-*" -type d 2>/dev/null | wc -l || echo "0")
            JSON_FILES=$(find public/api/vulns -name "*.json" 2>/dev/null | wc -l || echo "0")
            
            echo "build_success=true" >> $GITHUB_OUTPUT
            echo "cve_files_built=$CVE_FILES" >> $GITHUB_OUTPUT
            echo "json_files_built=$JSON_FILES" >> $GITHUB_OUTPUT
            echo "✓ Build completed successfully: $CVE_FILES CVE files, $JSON_FILES JSON files"
            
            # Quality gate: Fail if too many files were built
            if [ "$CVE_FILES" -gt 100 ]; then
              echo "::error::QUALITY GATE FAILURE: Built $CVE_FILES CVE files (expected ≤100)"
              echo "This indicates stale files were not properly cleaned"
              exit 1
            fi
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "::error::Build verification failed - required files missing"
            exit 1
          fi
      
      - name: Generate metrics visualization
        if: always()
        run: |
          echo "## 📊 Harvest Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -m scripts.visualize_metrics \
            --db-path actions-cache/metrics.db \
            --format github >> $GITHUB_STEP_SUMMARY || echo "Metrics not available" >> $GITHUB_STEP_SUMMARY
      
      - name: Update coverage badge
        if: github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run
        run: |
          python -m scripts.main update-badge
      
      - name: Commit changes
        if: github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update vulnerability briefing $(date +%Y-%m-%d)"
          git push
      
      - name: Upload Pages artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/
          retention-days: 1  # Reduce retention to ensure fresh deploys
      
      - name: Deploy to GitHub Pages
        if: github.event.inputs.dry_run != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Force deployment even if no changes detected
          # This ensures stale files are removed
          emit-telemetry: false
      
      - name: Post-deployment live site validation
        if: github.event.inputs.dry_run != 'true' && steps.deployment.outcome == 'success'
        id: live_validation
        run: |
          echo "🌐 POST-DEPLOY VALIDATION: Checking live site after deployment..."
          
          # Wait for deployment to propagate
          echo "Waiting 3 minutes for GitHub Pages deployment to propagate..."
          sleep 180
          
          # Install playwright for validation
          echo "Installing Playwright for live site testing..."
          pip install playwright
          playwright install chromium
          
          # Run live site validation
          echo "Running live site validation..."
          python -c "
          from scripts.agents.post_deploy_validation_agent import PostDeployValidationAgent
          from pathlib import Path
          import json
          
          agent = PostDeployValidationAgent()
          results = agent.validate_live_site(
              live_url='https://williamzujkowski.github.io/vuln-bot/',
              expected_cve_count=60,
              tolerance_percent=30,
              min_epss=60.0,
              screenshot_dir=Path('validation_screenshots')
          )
          
          # Save validation results
          with open('live_validation.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          # Print summary
          print(f\"Live validation status: {results.get('summary', {}).get('status', 'UNKNOWN')}\")
          print(f\"Checks passed: {results['checks_passed']}\")
          print(f\"Checks failed: {results['checks_failed']}\")
          
          if results['checks_failed'] > 0:
              print('CRITICAL FAILURES:')
              for failure in results['failures']:
                  if failure['severity'] in ['CRITICAL', 'HIGH']:
                      print(f\"  - {failure['check']}: {failure['message']}\")
              exit(1)
          else:
              print('✅ All live site validation checks passed')
          " || echo "Live validation failed - check logs"
      
      - name: Upload harvest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-logs-${{ github.run_number }}
          path: |
            harvest.log
            actions-cache/metrics.db
            actions-cache/api_cache/
          retention-days: 30
      
      - name: Export metrics data
        if: always()
        run: |
          python -m scripts.visualize_metrics \
            --db-path actions-cache/metrics.db \
            --format json \
            --export actions-cache/metrics-export.json || true
      
      - name: Upload compliance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports-${{ github.run_number }}
          path: |
            reports/epss_compliance_*.json
            reports/epss_compliance_*.txt
            reports/data_validation_*.json
            reports/data_validation_*.txt
          retention-days: 30
      
      - name: Post-build validation & quality gates
        id: verify_files
        run: |
          echo "🔍 POST-BUILD VALIDATION: Running comprehensive quality gates..."
          
          # Step 1: Verify no stale files remain
          echo "Step 1: Verifying no stale files remain..."
          STALE_CHECK_RESULT=0
          python -m scripts.cleanup_stale_files \
            --build-dir public \
            --api-dir api \
            --min-epss 0.6 \
            --verify-only || STALE_CHECK_RESULT=$?
          
          if [ $STALE_CHECK_RESULT -ne 0 ]; then
            echo "::error::CRITICAL: Stale files detected in final build!"
            exit 1
          fi
          
          # Step 2: Comprehensive file count analysis
          echo "Step 2: Comprehensive file count analysis..."
          if [ -d "public/api/vulns" ]; then
            CVE_COUNT=$(find public/cves -name "CVE-*" -type d 2>/dev/null | wc -l || echo "0")
            JSON_COUNT=$(find public/api/vulns -name "*.json" 2>/dev/null | wc -l || echo "0")
            HTML_COUNT=$(find public/cves -name "index.html" 2>/dev/null | wc -l || echo "0")
            
            echo "File counts: $CVE_COUNT CVE directories, $JSON_COUNT JSON files, $HTML_COUNT HTML files"
            echo "cve_count=$CVE_COUNT" >> $GITHUB_OUTPUT
            echo "json_count=$JSON_COUNT" >> $GITHUB_OUTPUT
            echo "html_count=$HTML_COUNT" >> $GITHUB_OUTPUT
            
            # Quality gate 1: Maximum CVE pages
            if [ "$CVE_COUNT" -gt 100 ]; then
              echo "::error::QUALITY GATE 1 FAILURE: Found $CVE_COUNT CVE directories (expected ≤100)"
              echo "This indicates the 15,000+ CVE issue has NOT been fixed"
              exit 1
            fi
            
            # Quality gate 2: HTML/CVE count consistency
            if [ "$HTML_COUNT" -ne "$CVE_COUNT" ]; then
              echo "::error::QUALITY GATE 2 FAILURE: HTML count ($HTML_COUNT) != CVE count ($CVE_COUNT)"
              exit 1
            fi
            
            # Quality gate 3: Reasonable range check (30 ±20 = 24-36 expected)
            if [ "$CVE_COUNT" -lt 20 ] || [ "$CVE_COUNT" -gt 80 ]; then
              echo "::warning::File count outside expected range: $CVE_COUNT (expected 20-80)"
            fi
            
            echo "✅ All quality gates passed"
          else
            echo "::error::Public API directory not found - build failed"
            exit 1
          fi
          
          # Step 3: Generate audit report
          echo "Step 3: Generating final audit report..."
          python -c "
          from scripts.agents.repo_audit_agent import RepoAuditAgent
          from pathlib import Path
          import json
          
          agent = RepoAuditAgent()
          valid_ids = agent._get_valid_cve_ids(Path('api'), 0.6)
          results = agent.audit_build_directory(Path('public'), valid_ids, expected_count=60)
          
          # Save audit results
          with open('final_audit.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          print(f\"Final audit: {len(results['stale_files'])} stale files, {len(set(results['unexpected_cves']))} unexpected CVEs\")
          " || echo "Audit generation failed"

      - name: Create harvest summary
        if: always()
        run: |
          echo "# Vulnerability Harvest Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Vulnerabilities Found:** ${{ steps.harvest.outputs.vulnerabilities_found || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**EPSS Compliance:** ${{ steps.compliance_check.outputs.compliance_passed == 'true' && '✅ PASSED' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ steps.build_site.outputs.build_success == 'true' && '✅ SUCCESS' || '⚠️ FALLBACK' }}" >> $GITHUB_STEP_SUMMARY
          echo "**File Counts:** CVE Pages: ${{ steps.verify_files.outputs.cve_count || 'N/A' }}, JSON Files: ${{ steps.verify_files.outputs.json_count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Live Site Validation:** ${{ steps.live_validation.outcome == 'success' && '✅ PASSED' || steps.live_validation.outcome == 'failure' && '❌ FAILED' || '⏭️ SKIPPED' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Critical fix status
          echo "## 🚨 Critical Fix Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CVE_COUNT=${{ steps.verify_files.outputs.cve_count || '0' }}
          if [ "$CVE_COUNT" -le 100 ]; then
            echo "✅ **15,000+ CVE Issue:** RESOLVED (showing $CVE_COUNT CVEs)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **15,000+ CVE Issue:** NOT FIXED (still showing $CVE_COUNT CVEs)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add live validation report if available
          if [ -f live_validation.json ]; then
            echo "## 🌐 Live Site Validation Results" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat live_validation.json | jq '.summary // {status: "unavailable"}' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add compliance report if available
          if [ -f reports/epss_compliance_daily.txt ]; then
            echo "## EPSS Threshold Compliance Report" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat reports/epss_compliance_daily.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add final audit results if available
          if [ -f final_audit.json ]; then
            echo "## Final Build Audit" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat final_audit.json | jq '{file_counts, stale_files: (.stale_files | length), unexpected_cves: (.unexpected_cves | length), recommendations}' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f harvest.log ]; then
            echo "## Harvest Log Summary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 harvest.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.harvest.outputs.vulnerabilities_found }}" != "0" ]; then
            echo "🌐 **Updated Site:** https://williamzujkowski.github.io/vuln-bot/" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Send alerts
        if: env.SEND_ALERTS == 'true' && (github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run)
        run: |
          python -m scripts.main send-alerts
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          SEND_ALERTS: ${{ vars.SEND_ALERTS }}