name: Enhanced CVE Harvest with Agent Architecture

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write  # Required for creating issues on failures

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      
    - name: Install dependencies
      run: |
        # Install Node.js dependencies first
        npm ci
        # Install Python dependencies
        uv pip install --system -r requirements.txt
        # Install Great Expectations if available
        uv pip install --system great-expectations || true

    - name: Configure git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Run vulnerability harvest with agents
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EPSS_API_KEY: ${{ secrets.EPSS_API_KEY }}
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        HARVEST_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        echo "🚀 Starting enhanced vulnerability harvest..."
        
        # Run harvest with agent orchestration
        if [ "$HARVEST_DRY_RUN" = "true" ]; then
          echo "Running in dry-run mode..."
          python -m scripts.main harvest --dry-run
        else
          python -m scripts.main harvest \
            --cache-dir .cache/ \
            --years 2024 2025 \
            --min-severity HIGH \
            --min-epss 0.7 \
            --use-releases
        fi

    - name: Generate vulnerability briefing
      if: ${{ !inputs.dry_run }}
      run: |
        echo "📝 Generating vulnerability briefing..."
        python -m scripts.main generate-briefing \
          --storage-strategy severity-year

    - name: Force clean build (Critical - prevents stale data)
      if: ${{ !inputs.dry_run }}
      run: |
        echo "🧹 Force cleaning and building site..."
        # CRITICAL: Clean all build directories to prevent 15,000+ CVE issue
        npm run clean
        # Verify directories are clean
        ls -la _site 2>/dev/null || echo "✅ _site directory cleaned"
        ls -la public 2>/dev/null || echo "✅ public directory cleaned"
        # Generate site with Python (no incremental builds)
        npm run build
        # Verify output was generated
        if [ ! -d "public" ] || [ -z "$(ls -A public)" ]; then
          echo "❌ Build failed - public directory is empty"
          exit 1
        fi
        echo "✅ Build completed successfully"
        
    - name: Update coverage badge
      if: ${{ !inputs.dry_run }}
      run: |
        echo "🏷️ Updating coverage badge..."
        python -m scripts.main update-badge || true

    - name: Critical CI/CD Gatecheck Validation
      if: ${{ !inputs.dry_run }}
      run: |
        echo "🔒 Running critical gatecheck validation..."
        
        # First, count files in the output directory
        if [ -d "public/cves" ]; then
          CVE_FILE_COUNT=$(find public/cves -name "CVE-*" -type d | wc -l)
          echo "Found $CVE_FILE_COUNT CVE directories in public/cves"
          if [ "$CVE_FILE_COUNT" -gt 100 ]; then
            echo "❌ CRITICAL: Found $CVE_FILE_COUNT CVE files (max allowed: 100)"
            echo "This indicates stale data or incremental build issues!"
            exit 1
          fi
        fi
        
        # Run comprehensive gatecheck
        python -m scripts.ci_gatecheck \
          --api-dir public/api \
          --cache-dir .cache \
          --max-cve-count 100 \
          --expected-cve-count 295 \
          --min-epss 0.6 \
          --output-report gatecheck-report.json \
          --fail-on-violations
        
        # Double-check the report
        if [ -f "gatecheck-report.json" ]; then
          TOTAL_CVES=$(jq -r '.metrics.total_cves // 0' gatecheck-report.json)
          echo "Gatecheck reports $TOTAL_CVES total CVEs"
          if [ "$TOTAL_CVES" -gt 100 ]; then
            echo "❌ Gatecheck failed: $TOTAL_CVES CVEs exceeds maximum of 100"
            exit 1
          fi
        fi

    - name: Upload gatecheck report
      if: ${{ !inputs.dry_run && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gatecheck-report
        path: gatecheck-report.json

    - name: Commit and push changes
      if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
      run: |
        # Check if there are changes
        if [ -n "$(git status --porcelain)" ]; then
          echo "📤 Committing and pushing changes..."
          
          git add -A
          git commit -m "chore: automated vulnerability harvest with agent architecture

        - Harvested new vulnerabilities
        - Generated briefing and API data
        - Validated data quality
        - Updated with agent orchestration
        
        [skip ci]"
          
          git push
        else
          echo "No changes to commit"
        fi

    - name: Deploy to GitHub Pages (Force Overwrite)
      if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
      run: |
        echo "🚀 Deploying to GitHub Pages with force overwrite..."
        # Create deployment script if it doesn't exist
        if [ ! -f "deploy_gh_pages.sh" ]; then
          cat > deploy_gh_pages.sh << 'EOF'
        #!/bin/bash
        set -e
        echo "Force deploying to gh-pages branch..."
        git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
        git checkout gh-pages
        # Remove ALL existing files (critical for preventing stale data)
        find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
        # Copy new files
        cp -r public/* . 2>/dev/null || echo "No public directory to copy"
        # Stage all changes
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to deploy"
        else
          git commit -m "Deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC') - Force clean deployment"
          git push origin gh-pages --force
          echo "✅ Deployment complete"
        fi
        EOF
          chmod +x deploy_gh_pages.sh
        fi
        
        # Run deployment with automatic push
        ./deploy_gh_pages.sh
        
        echo "✅ GitHub Pages deployment triggered"
        echo "⏱️  Deployment typically takes 5-10 minutes to propagate"

    - name: Send webhook notifications
      if: ${{ !inputs.dry_run }}
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
      run: |
        echo "📢 Sending notifications..."
        python -m scripts.main send-alerts --risk-threshold 80 || true

    - name: Upload harvest artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: harvest-artifacts
        path: |
          .cache/
          public/api/
          _posts/
        retention-days: 7