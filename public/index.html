<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerability Intelligence Dashboard - HTMX Version</title>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- HTMX Extensions -->
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/client-side-templates.js"></script>
    
    <!-- Alpine.js for light interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Modern Dark Theme */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1e1e2a;
            --bg-hover: #252535;
            
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --accent-danger: #ef4444;
            --accent-success: #10b981;
            
            --text-primary: #ffffff;
            --text-secondary: #a3a3b8;
            --text-muted: #6b6b85;
            
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            --shadow-glow: 0 0 40px rgba(0, 212, 255, 0.3);
            
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* Layout */
        .dashboard {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: rgba(18, 18, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
        }
        
        .brand h1 {
            font-size: 1.75rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Main Content */
        .main {
            flex: 1;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        /* Filters */
        .filters-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .filter-group label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .filter-group input,
        .filter-group select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        
        /* Search */
        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 1rem;
            color: var(--text-primary);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(0, 212, 255, 0.05);
        }
        
        /* Quick Filters */
        .quick-filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        .filter-chip {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-chip:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .filter-chip.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }
        
        /* Data Table */
        .data-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            overflow: hidden;
        }
        
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 1rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover {
            color: var(--accent-primary);
        }
        
        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        tbody tr {
            transition: background-color 0.2s ease;
        }
        
        tbody tr:hover {
            background: rgba(0, 212, 255, 0.02);
        }
        
        /* Severity Badges */
        .severity-badge {
            display: inline-flex;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .severity-critical {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }
        
        .severity-high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        /* Loading States */
        .htmx-indicator {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        
        .htmx-request .htmx-indicator {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 212, 255, 0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .page-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .chart-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 1.5rem;
        }
        
        .chart-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        /* HTMX Loading States */
        .htmx-swapping {
            opacity: 0.5;
            transition: opacity 200ms ease-out;
        }
        
        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.05) 25%, 
                rgba(255, 255, 255, 0.1) 50%, 
                rgba(255, 255, 255, 0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-icon">VB</div>
                    <div>
                        <h1>Vuln-Bot Intelligence</h1>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">
                            Real-time Vulnerability Monitoring
                        </p>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button class="filter-chip" 
                            hx-get="/vuln-bot/data/vulnerabilities.csv" 
                            hx-include="#filters-form">
                        Export CSV
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="main">
            <!-- Stats Section - Loaded via HTMX -->
            <div id="stats-container" 
                 hx-get="/vuln-bot/fragments/stats.html" 
                 hx-trigger="load, filter-change from:body"
                 hx-swap="innerHTML">
                <!-- Stats will be loaded here -->
                <div class="stats-grid">
                    <div class="stat-card skeleton" style="height: 150px;"></div>
                    <div class="stat-card skeleton" style="height: 150px;"></div>
                    <div class="stat-card skeleton" style="height: 150px;"></div>
                    <div class="stat-card skeleton" style="height: 150px;"></div>
                </div>
            </div>
            
            <!-- Quick Filters -->
            <div class="quick-filters">
                <button class="filter-chip" 
                        hx-get="/vuln-bot/fragments/filter/{filter}.html" 
                        hx-vals='{"filter": "all"}'
                        hx-target="#vulnerabilities-table"
                        hx-indicator=".htmx-indicator">
                    All Vulnerabilities
                </button>
                <button class="filter-chip" 
                        hx-get="/vuln-bot/fragments/filter/{filter}.html" 
                        hx-vals='{"filter": "critical"}'
                        hx-target="#vulnerabilities-table"
                        hx-indicator=".htmx-indicator">
                    <span class="severity-badge severity-critical">Critical</span>
                </button>
                <button class="filter-chip" 
                        hx-get="/vuln-bot/fragments/filter/{filter}.html" 
                        hx-vals='{"filter": "today"}'
                        hx-target="#vulnerabilities-table"
                        hx-indicator=".htmx-indicator">
                    📅 Today's CVEs
                </button>
                <button class="filter-chip" 
                        hx-get="/vuln-bot/fragments/filter/{filter}.html" 
                        hx-vals='{"filter": "kev"}'
                        hx-target="#vulnerabilities-table"
                        hx-indicator=".htmx-indicator">
                    ⭐ KEV Listed
                </button>
                <button class="filter-chip" 
                        hx-get="/vuln-bot/fragments/filter/{filter}.html" 
                        hx-vals='{"filter": "network"}'
                        hx-target="#vulnerabilities-table"
                        hx-indicator=".htmx-indicator">
                    🌐 Network Vector
                </button>
            </div>
            
            <!-- Filters Section -->
            <div class="filters-section" x-data="{ expanded: true }">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 style="font-size: 1.25rem;">Filters</h2>
                    <button @click="expanded = !expanded" 
                            style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">
                        <span x-text="expanded ? '−' : '+'"></span>
                    </button>
                </div>
                
                <div x-show="expanded" x-transition>
                    <form id="filters-form" 
                          hx-post="/api/filter" 
                          hx-trigger="change delay:500ms, submit" 
                          hx-target="#vulnerabilities-table"
                          hx-indicator=".htmx-indicator">
                        
                        <!-- Search -->
                        <div class="search-box">
                            <input type="text" 
                                   name="search" 
                                   class="search-input" 
                                   placeholder="Search CVE ID, vendor, or keyword..."
                                   hx-post="/api/search"
                                   hx-trigger="input changed delay:500ms"
                                   hx-target="#vulnerabilities-table"
                                   hx-indicator=".htmx-indicator">
                        </div>
                        
                        <!-- Filter Grid -->
                        <div class="filter-grid">
                            <div class="filter-group">
                                <label>Severity</label>
                                <select name="severity">
                                    <option value="">All</option>
                                    <option value="CRITICAL">Critical</option>
                                    <option value="HIGH">High</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="LOW">Low</option>
                                </select>
                            </div>
                            
                            <div class="filter-group">
                                <label>CVSS Score</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="number" name="cvss_min" placeholder="Min" min="0" max="10" step="0.1">
                                    <input type="number" name="cvss_max" placeholder="Max" min="0" max="10" step="0.1">
                                </div>
                            </div>
                            
                            <div class="filter-group">
                                <label>EPSS %</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="number" name="epss_min" placeholder="Min" min="0" max="100" value="70">
                                    <input type="number" name="epss_max" placeholder="Max" min="0" max="100" value="100">
                                </div>
                            </div>
                            
                            <div class="filter-group">
                                <label>Published Date</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="date" name="published_from">
                                    <input type="date" name="published_to">
                                </div>
                            </div>
                            
                            <div class="filter-group">
                                <label>Vendor</label>
                                <input type="text" name="vendor" placeholder="e.g., Microsoft">
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button type="submit" class="filter-chip active">Apply Filters</button>
                            <button type="reset" class="filter-chip"
                                    hx-get="/vuln-bot/fragments/vulnerabilities.html"
                                    hx-target="#vulnerabilities-table">
                                Reset
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Charts Section -->
            <div id="charts-container" 
                 hx-get="/vuln-bot/fragments/charts.html" 
                 hx-trigger="load, filter-change from:body"
                 hx-swap="innerHTML"
                 class="charts-grid">
                <!-- Charts will be loaded here -->
            </div>
            
            <!-- Data Table -->
            <div class="data-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.5rem;">Vulnerabilities</h2>
                    <div id="result-count" style="color: var(--text-secondary);">
                        <!-- Count will be updated via HTMX -->
                    </div>
                </div>
                
                <div id="vulnerabilities-table" 
                     hx-get="/vuln-bot/fragments/vulnerabilities.html" 
                     hx-trigger="load"
                     hx-indicator=".htmx-indicator">
                    <!-- Table will be loaded here -->
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>CVE ID</th>
                                    <th>Severity</th>
                                    <th>CVSS</th>
                                    <th>EPSS %</th>
                                    <th>Title</th>
                                    <th>Published</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Skeleton rows -->
                                <tr><td colspan="6" class="skeleton" style="height: 50px;"></td></tr>
                                <tr><td colspan="6" class="skeleton" style="height: 50px;"></td></tr>
                                <tr><td colspan="6" class="skeleton" style="height: 50px;"></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Loading Indicator -->
        <div class="htmx-indicator">
            <div class="spinner"></div>
        </div>
    </div>
    
    <script>
        // HTMX Configuration
        document.body.addEventListener('htmx:configRequest', (event) => {
            // Add custom headers if needed
            if (event.detail.headers) {
                event.detail.headers['X-Requested-With'] = 'HTMX';
            }
        });
        
        // Handle filter changes
        document.body.addEventListener('htmx:afterSwap', (event) => {
            // Trigger custom event for other components
            if (event.detail.target.id === 'vulnerabilities-table') {
                document.body.dispatchEvent(new Event('filter-change'));
            }
            
            // Initialize any charts if they were loaded
            if (event.detail.target.id === 'charts-container') {
                initializeCharts();
            }
        });
        
        // Initialize charts function
        function initializeCharts() {
            // This would be called after charts HTML is loaded
            // Initialize Chart.js charts here
            const severityCanvas = document.getElementById('severity-chart');
            if (severityCanvas && window.chartData) {
                new Chart(severityCanvas, {
                    type: 'doughnut',
                    data: window.chartData.severity,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#cbd5e1' }
                            }
                        }
                    }
                });
            }
        }
        
        // Enhanced interactivity with Alpine.js
        document.addEventListener('alpine:init', () => {
            // Any Alpine.js components can be defined here
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            switch(e.key) {
                case '/':
                    e.preventDefault();
                    document.querySelector('.search-input').focus();
                    break;
                case 'r':
                    e.preventDefault();
                    document.querySelector('[type="reset"]').click();
                    break;
                case 'e':
                    e.preventDefault();
                    document.querySelector('[hx-get="/vuln-bot/data/vulnerabilities.csv"]').click();
                    break;
            }
        });
    </script>

        <script>
        // HTMX Static Adapter for GitHub Pages
        document.body.addEventListener('htmx:configRequest', (event) => {
            // Handle dynamic URLs
            let url = event.detail.path;

            // Handle quick filters
            if (url.includes('{filter}')) {
                const filterMatch = event.detail.elt.getAttribute('hx-vals');
                if (filterMatch) {
                    const filter = JSON.parse(filterMatch).filter;
                    url = url.replace('{filter}', filter);
                }
            }

            // Handle sorting
            if (url.includes('{field}_{order}')) {
                const field = event.detail.elt.dataset.sort || 'epss_percentile';
                const currentOrder = event.detail.elt.textContent.includes('↓') ? 'desc' : 'asc';
                const newOrder = currentOrder === 'desc' ? 'asc' : 'desc';
                url = url.replace('{field}_{order}', field + '_' + newOrder);
            }

            event.detail.path = url;
        });

        // CVE Modal function
        function openCveModal(cveId) {
            // For static version, we'll show a simple modal with basic info
            const modal = document.getElementById('cve-modal') || createCveModal();
            const modalContent = modal.querySelector('.modal-content');

            // Find vulnerability data from table
            const row = document.querySelector(`tr[data-cve="${cveId}"]`);
            if (row) {
                const cells = row.querySelectorAll('td');
                modalContent.innerHTML = `
                    <h2>${cveId}</h2>
                    <p><strong>Severity:</strong> ${cells[1].textContent}</p>
                    <p><strong>CVSS Score:</strong> ${cells[2].textContent}</p>
                    <p><strong>EPSS:</strong> ${cells[3].textContent}</p>
                    <p><strong>Risk Score:</strong> ${cells[4].textContent}</p>
                    <p><strong>Title:</strong> ${cells[5].textContent}</p>
                    <p><strong>Vendors:</strong> ${cells[6].textContent}</p>
                    <p><strong>Published:</strong> ${cells[7].textContent}</p>
                    <button onclick="document.getElementById('cve-modal').style.display='none'">Close</button>
                `;
            }

            modal.style.display = 'block';
        }

        function createCveModal() {
            const modal = document.createElement('div');
            modal.id = 'cve-modal';
            modal.className = 'modal';
            modal.innerHTML = '<div class="modal-content"></div>';
            modal.style.cssText = `
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                z-index: 1000;
            `;
            document.body.appendChild(modal);

            // Close on background click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });

            return modal;
        }
        </script>
        
</body>
</html>
