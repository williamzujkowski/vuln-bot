        <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <span class="text-xl">🛡️</span>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900 dark:text-white">Vuln-Bot</h1>
                        <p class="text-xs text-gray-600 dark:text-gray-400">CVE Intelligence</p>
                    </div>
                </div>
                <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                    <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <main class="max-w-7xl mx-auto px-4 py-8">
            <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="bg-white dark:bg-gray-900 rounded-xl p-6 border border-gray-200 dark:border-gray-800">
                    <p class="text-sm text-gray-600 dark:text-gray-400">Total CVEs</p>
                    <p class="text-3xl font-bold mt-2 text-cyan-600 dark:text-cyan-400">297</p>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl p-6 border border-gray-200 dark:border-gray-800">
                    <p class="text-sm text-gray-600 dark:text-gray-400">Critical</p>
                    <p class="text-3xl font-bold mt-2 text-red-600 dark:text-red-400">186</p>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl p-6 border border-gray-200 dark:border-gray-800">
                    <p class="text-sm text-gray-600 dark:text-gray-400">High</p>
                    <p class="text-3xl font-bold mt-2 text-orange-600 dark:text-orange-400">111</p>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl p-6 border border-gray-200 dark:border-gray-800">
                    <p class="text-sm text-gray-600 dark:text-gray-400">KEV Listed</p>
                    <p class="text-3xl font-bold mt-2 text-purple-600 dark:text-purple-400">75</p>
                </div>
            </section>
            
            <section class="bg-white dark:bg-gray-900 rounded-xl p-6 border border-gray-200 dark:border-gray-800">
                <h2 class="text-lg font-semibold mb-4 text-gray-900 dark:text-white">Vulnerabilities</h2>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-200 dark:border-gray-800">
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700 dark:text-gray-300">CVE ID</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700 dark:text-gray-300">Severity</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700 dark:text-gray-300">CVSS</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700 dark:text-gray-300">Product</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="vuln in vulnerabilities.slice(0, 10)" :key="vuln.cve_id">
                                <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                                    <td class="py-3 px-4 text-sm text-cyan-600 dark:text-cyan-400 font-mono" x-text="vuln.cve_id"></td>
                                    <td class="py-3 px-4">
                                        <span x-text="vuln.severity" 
                                              :class="vuln.severity === 'CRITICAL' ? 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-800' : 'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 border border-orange-200 dark:border-orange-800'"
                                              class="px-2 py-1 rounded text-xs font-semibold"></span>
                                    </td>
                                    <td class="py-3 px-4 text-sm text-gray-900 dark:text-gray-100" x-text="vuln.cvss_score.toFixed(1)"></td>
                                    <td class="py-3 px-4 text-sm text-gray-700 dark:text-gray-300" x-text="vuln.products"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <p class="mt-4 text-sm text-gray-600 dark:text-gray-400">Showing 10 of <span x-text="vulnerabilities.length"></span> vulnerabilities</p>
            </section>
        </main>
    </div>
</body>
</html>
